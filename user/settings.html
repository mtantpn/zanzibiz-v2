<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Account Settings - ZanziBiz</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#22C55E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/Zanzibiz.com-logo.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #FAF7F2;
            color: #1C2B3A;
        }
        h1,h2,h3,h4 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #1C2B3A;
            letter-spacing: -0.02em;
        }
        .font-display {
            font-family: 'Playfair Display', Georgia, serif !important;
        }
    </style>
    <style>
        #__auth_overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: #FAF7F2;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
        }
        #__auth_overlay .auth-spinner {
            width: 44px; height: 44px;
            border: 3px solid #e5e0d8;
            border-top-color: #C8892A;
            border-radius: 50%;
            animation: auth-spin 0.75s linear infinite;
        }
        #__auth_overlay p {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            font-size: 14px; color: #6b7280; margin: 0;
        }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="font-body bg-ivory">
    <div id="__auth_overlay">
        <div class="auth-spinner"></div>
        <p>Loading your settings&hellip;</p>
    </div>
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 sm:h-24">
                <a href="../index.html" class="flex items-center space-x-2">
                    <img src="/Zanzibiz.com-logo.png" alt="ZanziBiz - Zanzibar Business Directory and Travel Guide" class="h-16 sm:h-20 md:h-24 w-auto">
                </a>
                <div class="flex items-center space-x-4">
                    <div id="userMenu" class="relative">
                        <button id="userMenuButton" class="flex items-center space-x-2 text-gray-600 hover:text-[#C8892A] transition-colors">
                            <div class="w-8 h-8 bg-[#C8892A] rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                <span id="userMenuInitial">U</span>
                            </div>
                            <span id="userMenuName" class="font-medium hidden md:block">User</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>

                        <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
                            <a href="../business/dashboard.html" id="businessDashboardLink" class="hidden block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                </svg>
                                Dashboard
                            </a>
                            <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                My Profile
                            </a>
                            <a href="liked.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                Liked Listings
                            </a>
                            <a href="settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 bg-gray-50">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                Settings
                            </a>
                            <hr class="my-2">
                            <button onclick="handleLogout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="font-display text-3xl font-bold text-[#1C2B3A] mb-8">Account Settings</h1>

        <div id="successMessage" class="hidden bg-[#E8F4F4] border border-[#2A8C8A] text-[#2A8C8A] px-4 py-3 rounded-lg mb-6">
            <p class="text-sm">Settings updated successfully!</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
            <p class="text-sm"></p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-[#E4D9CC] p-6 mb-6">
            <h2 class="text-xl font-semibold text-[#1C2B3A] mb-4">Profile Information</h2>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#1C2B3A] mb-2">Profile Picture</label>
                    <div class="flex items-center space-x-6">
                        <div class="relative">
                            <div id="profilePicturePreview" class="w-24 h-24 bg-[#C8892A] rounded-full flex items-center justify-center text-white font-bold text-4xl overflow-hidden">
                                <span id="profileInitial">U</span>
                            </div>
                        </div>
                        <div class="flex-1">
                            <input
                                type="file"
                                id="profilePicture"
                                accept="image/*"
                                class="hidden"
                            >
                            <button
                                type="button"
                                onclick="document.getElementById('profilePicture').click()"
                                class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium"
                            >
                                Change Picture
                            </button>
                            <button
                                type="button"
                                id="removeProfilePicture"
                                class="hidden ml-2 px-4 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 transition-colors text-sm font-medium"
                            >
                                Remove
                            </button>
                            <p class="text-xs text-gray-500 mt-2">JPG, PNG or WebP. Max 1MB.</p>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#1C2B3A] mb-2">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        required
                        class="w-full px-4 py-3 border border-[#E4D9CC] bg-[#FAF7F2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C8892A] focus:border-[#C8892A]"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#1C2B3A] mb-2">Email</label>
                    <input
                        type="email"
                        id="email"
                        disabled
                        class="w-full px-4 py-3 border border-[#E4D9CC] rounded-lg bg-[#F5EFE5] text-gray-500"
                    >
                    <p class="text-xs text-gray-500 mt-1">Email cannot be changed</p>
                </div>

                <button
                    type="submit"
                    style="background:#C8892A;color:white;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;"
                    class="px-6 py-3 hover:opacity-90 transition-opacity"
                    id="saveProfileButton"
                >
                    Save Changes
                </button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-[#E4D9CC] p-6">
            <h2 class="text-xl font-semibold text-[#1C2B3A] mb-4">Change Password</h2>
            <form id="passwordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#1C2B3A] mb-2">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-[#E4D9CC] bg-[#FAF7F2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C8892A] focus:border-[#C8892A]"
                        placeholder="Enter new password"
                    >
                    <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#1C2B3A] mb-2">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-[#E4D9CC] bg-[#FAF7F2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C8892A] focus:border-[#C8892A]"
                        placeholder="Confirm new password"
                    >
                </div>

                <button
                    type="submit"
                    style="background:#C8892A;color:white;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;"
                    class="px-6 py-3 hover:opacity-90 transition-opacity"
                    id="changePasswordButton"
                >
                    Change Password
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../lib/supabase.js';
        import { requireAuth } from '../lib/auth-guard.js';

        let currentUserId = null;
        let currentProfilePicture = null;
        let newProfilePictureFile = null;

        async function loadProfile() {
            const authResult = await requireAuth('any');
            if (!authResult) return;

            currentUserId = authResult.user.id;

            const { data: profile } = await supabase
                .from('profiles')
                .select('full_name, email, profile_picture, user_type, business_profiles(*)')
                .eq('id', currentUserId)
                .maybeSingle();

            if (profile) {
                document.getElementById('fullName').value = profile.full_name || '';
                document.getElementById('email').value = profile.email || authResult.user.email;

                currentProfilePicture = profile.profile_picture;
                updateProfilePicturePreview(profile.profile_picture, profile.full_name || profile.email);

                // Populate dropdown menu
                const fullName = profile.full_name || authResult.user.email.split('@')[0];
                const firstName = fullName.split(' ')[0];
                document.getElementById('userMenuName').textContent = firstName;
                document.getElementById('userMenuInitial').textContent = firstName.charAt(0).toUpperCase();

                // Show dashboard link for business users
                if (profile.user_type === 'business' && profile.business_profiles?.[0]) {
                    document.getElementById('businessDashboardLink').classList.remove('hidden');
                }
            }
        }

        function updateProfilePicturePreview(pictureUrl, name) {
            const preview = document.getElementById('profilePicturePreview');
            const initial = document.getElementById('profileInitial');
            const removeBtn = document.getElementById('removeProfilePicture');

            if (pictureUrl) {
                preview.style.backgroundImage = `url(${pictureUrl})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                initial.style.display = 'none';
                removeBtn.classList.remove('hidden');
            } else {
                preview.style.backgroundImage = '';
                initial.textContent = name ? name.charAt(0).toUpperCase() : 'U';
                initial.style.display = 'flex';
                removeBtn.classList.add('hidden');
            }
        }

        document.getElementById('profilePicture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 1048576) {
                alert('File is too large. Maximum size is 1MB');
                e.target.value = '';
                return;
            }

            newProfilePictureFile = file;

            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('profilePicturePreview');
                const initial = document.getElementById('profileInitial');
                preview.style.backgroundImage = `url(${event.target.result})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                initial.style.display = 'none';
                document.getElementById('removeProfilePicture').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('removeProfilePicture').addEventListener('click', async function() {
            if (!confirm('Are you sure you want to remove your profile picture?')) return;

            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            try {
                if (currentProfilePicture) {
                    const fileName = currentProfilePicture.split('/').pop();
                    await supabase.storage
                        .from('profile-pictures')
                        .remove([`${currentUserId}/${fileName}`]);
                }

                const { error } = await supabase
                    .from('profiles')
                    .update({ profile_picture: null })
                    .eq('id', currentUserId);

                if (error) throw error;

                currentProfilePicture = null;
                newProfilePictureFile = null;
                document.getElementById('profilePicture').value = '';

                const fullName = document.getElementById('fullName').value;
                updateProfilePicturePreview(null, fullName);

                successMessage.classList.remove('hidden');
                successMessage.querySelector('p').textContent = 'Profile picture removed successfully!';
                setTimeout(() => successMessage.classList.add('hidden'), 3000);
            } catch (error) {
                console.error('Error removing profile picture:', error);
                errorMessage.classList.remove('hidden');
                errorMessage.querySelector('p').textContent = error.message || 'Failed to remove profile picture';
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const saveButton = document.getElementById('saveProfileButton');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            try {
                let profilePictureUrl = currentProfilePicture;

                if (newProfilePictureFile) {
                    const fileExt = newProfilePictureFile.name.split('.').pop();
                    const fileName = `${currentUserId}/avatar.${fileExt}`;

                    const { error: uploadError } = await supabase.storage
                        .from('profile-pictures')
                        .upload(fileName, newProfilePictureFile, {
                            cacheControl: '3600',
                            upsert: true
                        });

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabase.storage
                        .from('profile-pictures')
                        .getPublicUrl(fileName);

                    profilePictureUrl = publicUrlData.publicUrl;
                    newProfilePictureFile = null;
                    document.getElementById('profilePicture').value = '';
                }

                const { error } = await supabase
                    .from('profiles')
                    .update({
                        full_name: fullName,
                        profile_picture: profilePictureUrl
                    })
                    .eq('id', currentUserId);

                if (error) throw error;

                currentProfilePicture = profilePictureUrl;

                successMessage.classList.remove('hidden');
                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 3000);
            } catch (error) {
                console.error('Error updating profile:', error);
                errorMessage.classList.remove('hidden');
                errorMessage.querySelector('p').textContent = error.message || 'Failed to update profile';
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Save Changes';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const changeButton = document.getElementById('changePasswordButton');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            if (newPassword !== confirmPassword) {
                errorMessage.classList.remove('hidden');
                errorMessage.querySelector('p').textContent = 'Passwords do not match';
                return;
            }

            changeButton.disabled = true;
            changeButton.textContent = 'Changing...';
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                successMessage.classList.remove('hidden');
                successMessage.querySelector('p').textContent = 'Password changed successfully!';
                document.getElementById('passwordForm').reset();

                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 3000);
            } catch (error) {
                console.error('Error changing password:', error);
                errorMessage.classList.remove('hidden');
                errorMessage.querySelector('p').textContent = error.message || 'Failed to change password';
            } finally {
                changeButton.disabled = false;
                changeButton.textContent = 'Change Password';
            }
        });

        async function checkUserType() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const { data: profile } = await supabase
                .from('profiles')
                .select('user_type')
                .eq('id', user.id)
                .maybeSingle();

            if (profile?.user_type === 'business') {
                document.getElementById('businessDashboardLink').classList.remove('hidden');
            }
        }

        function handleLogout() {
            supabase.auth.signOut();
            window.location.href = '../index.html';
        }

        checkUserType();
        // Toggle user dropdown
        document.getElementById('userMenuButton')?.addEventListener('click', () => {
            document.getElementById('userDropdown').classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('userMenu');
            const userDropdown = document.getElementById('userDropdown');
            if (userMenu && !userMenu.contains(e.target)) {
                userDropdown?.classList.add('hidden');
            }
        });

        loadProfile();
    </script>
</body>
</html>
