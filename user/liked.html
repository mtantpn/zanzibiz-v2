<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Liked Listings - ZanziBiz</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#22C55E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/Zanzibiz.com-logo.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #FFFFFF;
            color: #1D2427;
        }
        h1,h2,h3,h4 {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #1D2427;
            letter-spacing: -0.02em;
        }
        .font-display {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
        }
    </style>
    <style>
        #__auth_overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
        }
        #__auth_overlay .auth-spinner {
            width: 44px; height: 44px;
            border: 3px solid #e5e0d8;
            border-top-color: #0A6A94;
            border-radius: 50%;
            animation: auth-spin 0.75s linear infinite;
        }
        #__auth_overlay p {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            font-size: 14px; color: #6b7280; margin: 0;
        }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="font-body bg-ivory">
    <div id="__auth_overlay">
        <div class="auth-spinner"></div>
        <p>Loading your favourites&hellip;</p>
    </div>
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 sm:h-24">
                <a href="../index.html" class="flex items-center space-x-2">
                    <img src="/Zanzibiz.com-logo.png" alt="ZanziBiz - Zanzibar Business Directory and Travel Guide" class="h-16 sm:h-20 md:h-24 w-auto">
                </a>
                <div class="flex items-center space-x-4">
                    <div id="userMenu" class="relative">
                        <button id="userMenuButton" class="flex items-center space-x-2 text-gray-600 hover:text-[#0A6A94] transition-colors">
                            <div class="w-8 h-8 bg-[#0A6A94] rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                <span id="userMenuInitial">U</span>
                            </div>
                            <span id="userMenuName" class="font-medium hidden md:block">User</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>

                        <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
                            <a href="../business/dashboard.html" id="businessDashboardLink" class="hidden block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                </svg>
                                Dashboard
                            </a>
                            <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                My Profile
                            </a>
                            <a href="liked.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 bg-gray-50">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                Liked Listings
                            </a>
                            <a href="settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                Settings
                            </a>
                            <hr class="my-2">
                            <button onclick="handleLogout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="font-display text-2xl sm:text-3xl font-bold text-[#1D2427]">Liked Listings</h1>
                <p class="text-gray-600 mt-2">Your favorite businesses and places</p>
            </div>
            <div class="flex items-center space-x-2 text-[#0A6A94]">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                </svg>
                <span id="likedCount" class="font-semibold">0 liked</span>
            </div>
        </div>

        <div id="emptyState" class="hidden text-center py-16">
            <svg class="w-24 h-24 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">No Liked Listings Yet</h3>
            <p class="text-gray-500 mb-6">Start exploring and save your favorite businesses</p>
            <a href="../index.html#listings" style="background:#FFC72C;color:#1D2427;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;" class="inline-block px-6 py-3 hover:opacity-90 transition-opacity">
                Browse Listings
            </a>
        </div>

        <div id="loadingState" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-[#0A6A94]"></div>
            <p class="text-gray-600 mt-4">Loading your liked listings...</p>
        </div>

        <div id="listingsGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        </div>
    </div>

    <script type="module">
        import { supabase } from '../lib/supabase.js';
        import { requireAuth } from '../lib/auth-guard.js';

        async function loadLikedListings() {
            const authResult = await requireAuth('any');
            if (!authResult) return;

            const session = { user: authResult.user };

            // Load user profile for dropdown menu
            const { data: profile } = await supabase
                .from('profiles')
                .select('full_name, user_type, business_profiles(*)')
                .eq('id', session.user.id)
                .maybeSingle();

            if (profile) {
                const fullName = profile.full_name || session.user.email.split('@')[0];
                const firstName = fullName.split(' ')[0];
                document.getElementById('userMenuName').textContent = firstName;
                document.getElementById('userMenuInitial').textContent = firstName.charAt(0).toUpperCase();

                // Show dashboard link for business users
                if (profile.user_type === 'business') {
                    document.getElementById('businessDashboardLink').classList.remove('hidden');
                }
            }

            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const listingsGrid = document.getElementById('listingsGrid');

            loadingState.classList.remove('hidden');

            try {
                const { data: favorites, error } = await supabase
                    .from('favorites')
                    .select(`
                        listing_id,
                        listings (
                            id,
                            title,
                            description,
                            category,
                            location,
                            price,
                            images,
                            slug
                        )
                    `)
                    .eq('user_id', session.user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const likedListings = favorites?.map(f => f.listings).filter(l => l !== null) || [];

                loadingState.classList.add('hidden');
                document.getElementById('likedCount').textContent = `${likedListings.length} liked`;

                if (likedListings.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    listingsGrid.classList.remove('hidden');
                    listingsGrid.innerHTML = likedListings.map(listing => `
                        <div class="bg-white rounded-xl shadow-sm border border-[#EBEBEB] overflow-hidden hover:shadow-md transition-shadow">
                            <div class="h-48 bg-gradient-to-br from-gray-200 to-gray-300 relative">
                                ${listing.images && listing.images[0] ?
                                    `<img src="${listing.images[0]}" alt="${listing.title}" class="w-full h-full object-cover">` :
                                    `<div class="w-full h-full flex items-center justify-center">
                                        <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                        </svg>
                                    </div>`
                                }
                                <button onclick="unlikeListing('${listing.id}')" class="absolute top-3 right-3 bg-white rounded-full p-2 hover:bg-gray-100 transition-colors">
                                    <svg class="w-5 h-5 text-[#0A6A94] fill-current" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="p-6">
                                <h3 class="font-semibold text-lg text-[#1D2427] mb-2">${listing.title}</h3>
                                <p class="text-gray-600 text-sm mb-3 line-clamp-2">${listing.description || 'No description available'}</p>
                                <div class="flex items-center justify-between text-sm">
                                    <span class="text-gray-500 capitalize">${listing.category}</span>
                                    <span class="text-gray-500">${listing.location || 'Zanzibar'}</span>
                                </div>
                                <div class="mt-4 pt-4 border-t border-gray-100">
                                    <a href="../index.html#listing-${listing.slug}" class="text-[#0A6A94] hover:opacity-80 font-medium">View Details →</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading liked listings:', error);
                loadingState.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.querySelector('h3').textContent = 'Error Loading Listings';
                emptyState.querySelector('p').textContent = 'Please try again later';
            }
        }

        async function checkUserType() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            const { data: profile } = await supabase
                .from('profiles')
                .select('user_type')
                .eq('id', session.user.id)
                .maybeSingle();

            if (profile?.user_type === 'business') {
                document.getElementById('businessDashboardLink').classList.remove('hidden');
            }
        }

        function handleLogout() {
            supabase.auth.signOut();
            window.location.href = '../index.html';
        }

        checkUserType();
        window.unlikeListing = async function(listingId) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert('Please log in to manage favorites');
                return;
            }

            try {
                const { error } = await supabase
                    .from('favorites')
                    .delete()
                    .eq('user_id', session.user.id)
                    .eq('listing_id', listingId);

                if (error) throw error;

                await loadLikedListings();
            } catch (error) {
                console.error('Error removing favorite:', error);
                alert('Error removing favorite: ' + error.message);
            }
        };

        // Toggle user dropdown
        document.getElementById('userMenuButton')?.addEventListener('click', () => {
            document.getElementById('userDropdown').classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('userMenu');
            const userDropdown = document.getElementById('userDropdown');
            if (userMenu && !userMenu.contains(e.target)) {
                userDropdown?.classList.add('hidden');
            }
        });

        loadLikedListings();
    </script>
</body>
</html>
